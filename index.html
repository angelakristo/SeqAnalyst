<!DOCTYPE html>
<html>
<head>
    <title>SeqAnalyst</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>SeqAnalyst</h1>
<p>DNA Sequence Analyzer</p>

<input type="text" id="dnaInput" placeholder="Enter DNA sequence">

<button onclick = "parentFunc()">Analyze</button>
<div id="errorMessage" class="error hidden"></div>

<div id="results" class="results hidden">
  <div class="card">
    <h2>DNA Sequence</h2>
    <div id="dnaResult" class="sequence"></div>
  </div>
  <div class="card">
    <h2>RNA Sequence</h2>
    <div id="rnaResult" class="sequence"></div>
  </div>
  <div class="card">
    <h2>Codons</h2>
    <div id="codonsResult" class="sequence"></div>
  </div>
  <div class="card">
    <h2>Protein</h2>
    <div id="proteinResult" class="sequence"></div>
  </div>
</div>





<script src="script.js"></script>
</body>
</html>
