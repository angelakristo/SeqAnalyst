<!DOCTYPE html>
<html>
<head>
    <title>SeqAnalyst</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>SeqAnalyst</h1>
<p>DNA Sequence Analyzer</p>

<input type="text" id="dnaInput" placeholder="Enter DNA sequence">

<div class="strand-selector">
  <label>Strand:</label>
  <label><input type="radio" name="strand" value="coding" checked> Coding (sense)</label>
  <label><input type="radio" name="strand" value="template"> Template (antisense)</label>
</div>

<div class="frame-selector">
  <label>Reading Frame:</label>
  <label><input type="radio" name="frame" value="1" checked> Frame 1</label>
  <label><input type="radio" name="frame" value="2"> Frame 2</label>
  <label><input type="radio" name="frame" value="3"> Frame 3</label>
</div>

<button onclick="parentFunc()">Analyze</button>
<button id="loadExampleBtn">Load Example</button>
<div id="errorMessage" class="error hidden"></div>

<div id="results" class="results hidden">
  <div class="card dna-card">
    <div class="card-header">
      <h2>DNA Sequence</h2>
      <button class="copy-btn" data-target="dnaResult">Copy</button>
    </div>
    <div id="dnaResult" class="sequence"></div>
  </div>
  <div class="card stats-card">
    <h2>Sequence Statistics</h2>
    <div id="statsResult"></div>
  </div>
  <div class="card rna-card">
    <div class="card-header">
      <h2>RNA Sequence</h2>
      <button class="copy-btn" data-target="rnaResult">Copy</button>
    </div>
    <div id="rnaResult" class="sequence"></div>
  </div>
  <div class="card codons-card">
    <div class="card-header">
      <h2>Codons</h2>
      <button class="copy-btn" data-target="codonsResult">Copy</button>
    </div>
    <div id="codonsResult" class="sequence"></div>
  </div>
  <div class="card protein-card">
    <div class="card-header">
      <h2>Protein</h2>
      <button class="copy-btn" data-target="proteinResult">Copy</button>
    </div>
    <div id="proteinResult" class="sequence"></div>
  </div>
</div>





<script src="script.js"></script>
</body>
</html>
